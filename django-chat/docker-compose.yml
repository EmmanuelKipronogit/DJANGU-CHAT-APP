# Local stack mirroring production: Django (Daphne) + Postgres + Redis.
#   cp .env.example .env   (fill in the Google keys)   then:   docker compose up --build
services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file: .env
    environment:
      DATABASE_URL: postgres://chat:chat@db:5432/chat
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7

volumes:
  pgdata:
